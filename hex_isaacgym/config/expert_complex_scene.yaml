  body_leg_mesh: package://hex_kinematic/resources/hex_magnetic/body_leg_collision.STL
  body_env_mesh: package://hex_kinematic/resources/hex_magnetic/body_env_collision.STL
  point_map_file: ${DATA_ROOT}/maps/complex_surface4/complex_surface4_point_map.npz
  env_cache_file: ${DATA_ROOT}/maps/complex_surface4/env_voxels.npz
