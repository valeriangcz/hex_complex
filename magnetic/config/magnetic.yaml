# 示例值，必须用实测数据标定有效范围、腿序和每腿 raw_min/raw_max。
# raw_min 对应 0%，raw_max 对应 100%；有效范围独立于归一化标定。
port: /dev/stm32
baud_rate: 115200
channel_order: [lf, lm, lb, rf, rm, rb]
lower_bound: 0
upper_bound: 4095
calibration:
  lf: {raw_min: 2090, raw_max: 2500}
  lm: {raw_min: 2010, raw_max: 2350}
  lb: {raw_min: 2050, raw_max: 2400}
  rf: {raw_min: 2010, raw_max: 2340}
  rm: {raw_min: 2040, raw_max: 2410}
  rb: {raw_min: 2040, raw_max: 2400}
