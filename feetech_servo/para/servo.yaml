# All six-element arrays use this order: lf, lm, lb, rf, rm, rb.
port: /dev/feetech
baud_rate: 1000000
ids: [1, 2, 3, 4, 5, 6]

# Absolute servo angle when the corresponding command is 0 degrees.
# Replace with measured installation offsets before controlling the mechanism.
offset_deg: [132.0, 133.0, 132.0, 133.0, 133.0, 133.0]
direction: [1, 1, 1, 1, 1, 1]

# Initial conversion convention; calibrate against the actual servo variant.
#舵机最高速度V=1500*0.059=88.5rpm
#设置move_time_ms=0,表示采用速度
angle_span_deg: 270.0
raw_max: 1023
move_time_ms: 0
speed: 800
read_timeout_ms: 20

# Poll feedback even before receiving commands; 0 selects command-only feedback.
state_hz: 5.0
